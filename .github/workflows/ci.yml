name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The suite deliberately needs no Postgres or Redis — SQLite and
      # fakeredis stand in — so CI runs with zero service containers.
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70 -q

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Catches malformed YAML, bad service references, and missing mounted
      # config files before anyone tries to run the stack.
      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build api

  lint:
    name: Config sanity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate Grafana dashboard and Prometheus config parse
        run: |
          python -c "import json; json.load(open('infra/grafana/url-shortener-dashboard.json')); print('dashboard ok')"
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('infra/prometheus.yml')); print('prometheus ok')"

      - name: Shell scripts are syntactically valid
        run: bash -n loadtest/chaos_test.sh
