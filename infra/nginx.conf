events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS resolves "api" to the IPs of every replica of the
    # api service. Re-resolving on a short TTL means replicas that are added or
    # removed (including one killed by the chaos test) are picked up without an
    # nginx reload.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        location / {
            # Using a variable (rather than a literal upstream) forces nginx to
            # go through the resolver on each request instead of caching the
            # replica IPs at startup.
            set $backend "http://api:8000";
            proxy_pass $backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;

            # If a replica dies mid-request, transparently retry against
            # another one. This is what makes "kill a replica, zero failed
            # requests" actually hold under load.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            # Do not follow the 301 the app returns; the load test asserts on it.
            proxy_redirect off;
        }
    }
}
